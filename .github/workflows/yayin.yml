name: Tuzak Soru Yayin
on:
  push:
    paths: ["kuyruk/**"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yayin
  cancel-in-progress: false
jobs:
  yayin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Yayinla
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
        run: python yayinla.py
      - name: Durumu kaydet
        run: |
          git config user.name "yayin-bot"
          git config user.email "yayin-bot@users.noreply.github.com"
          git add kuyruk
          git diff --cached --quiet || (git commit -m "Yayin durumu guncellendi" && git pull --rebase && git push)
